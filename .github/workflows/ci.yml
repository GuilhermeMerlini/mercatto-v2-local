name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check app

      - name: Testes das issues feitas
        run: python -m pytest -q -p no:warnings $(grep -v '^#' ../.github/ci-tests.txt)

      # As issues proíbem alterar os testes. Para liberar de propósito, use a label "edita-testes" no PR.
      - name: Testes não foram alterados
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'edita-testes')
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- tests/)
          if [ -n "$changed" ]; then
            echo "::error::Este PR altera arquivos de backend/tests/:"
            echo "$changed"
            exit 1
          fi
